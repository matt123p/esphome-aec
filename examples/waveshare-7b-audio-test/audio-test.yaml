esphome:
  name: esp-1024-audio-test
  friendly_name: ESP 1024 Audio Test
  on_boot:
    priority: -100
    then:
      - switch.turn_on: speaker_amp
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - audio_dac.set_volume:
          id: audio_adc_es8311
          volume: 70%
      - lambda: |-
          id(audio_test_meters).set_spectrum_enabled(true);
          id(audio_test).set_diagnostic_raw_slot(-1);

external_components:
  - source:
      type: git
      url: https://github.com/matt123p/esphome-aec
      ref: main
      path: src/esphome
    components: [aec_speexdsp]
  - source:
      type: git
      url: https://github.com/matt123p/esphome
      ref: feature/es7210-aec-fix
      path: esphome/components
    components: [es7210]

esp32:
  board: esp32-p4
  variant: ESP32P4
  engineering_sample: true
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      # Compile for speed, not size: the default (-Os) makes the
      # floating-point DSP loops several times slower. Both options are
      # needed - they form a Kconfig choice and the size default must be
      # explicitly cleared.
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "n"
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      # Size the ESP-DSP twiddle tables for the largest frame this component
      # allows (frame_size 1024 -> 2048-point window).
      CONFIG_DSP_MAX_FFT_SIZE_2048: "y"

psram:
  mode: hex
  speed: 200MHz
  ignore_not_found: false

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

audio_adc:
  - platform: es7210
    id: audio_adc_es7210
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 33db
    tdm: true

audio_dac:
  - platform: es8311
    id: audio_adc_es8311
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

# =============================================================================
# aec_speexdsp hub - SpeexDSP echo cancellation + noise suppression + AGC + VAD
#
# Fixed by the component: 16 kHz, 16-bit, four-slot Philips-format TDM, the
# component is the I2S master and owns the paired RX/TX channels. The
# `audio_adc` above only configures the codec.
# =============================================================================
aec_speexdsp:
  id: audio_test

  # --- Transport -------------------------------------------------------------

  # ID of the configured audio_adc object. It is only used to initialise the
  # ES7210 (or another codec); the I2S peripheral itself is created here.
  audio_adc: audio_adc_es7210

  # I2S pins. All are required. MCLK/BCLK/LRCLK/DOUT are outputs, DIN is an
  # input. RX and TX share the clocks so capture, reference and playback stay
  # synchronised (a hard requirement for reference-based AEC).
  mclk_pin: GPIO13
  bclk_pin: GPIO12
  lrclk_pin: GPIO10
  din_pin: GPIO11
  dout_pin: GPIO9

  # ESP-IDF I2S peripheral number. Options: 0 - 2 (available ports are
  # chip-dependent; the P4/S3 also have an I2S1/I2S2).
  i2s_port: 0

  # Number of TDM time slots on the shared data wire per frame. The schema
  # currently accepts exactly 4. The ES7210 in TDM mode produces 4 slots.
  tdm_slots: 4

  # Which RX slot(s) carry microphones. Options: one to four distinct
  # slots, each 0 - 3, and not the analog reference slot.
  #   - one slot: single-microphone processing (the SpeexDSP sweet spot)
  #   - two or more slots: beamforming can align and combine them.
  # Waveshare 7B wiring: microphone 1 = slot 0, microphone 2 = slot 2.
  microphone_slots: [0, 2]

  # Where the echo canceller gets its reference (the sound the device itself
  # is playing). Options:
  #   analog_slot - read the loopback signal from an ADC slot (preferred; the
  #                 7B routes the amp signal to slot 1). Needs reference_slot.
  #   playback    - use a mono copy of the accepted speaker PCM from a ring
  #                 buffer. No wiring needed, but cannot see DAC/amp/speaker
  #                 delay, gain or distortion, so cancellation is weaker.
  reference_source: analog_slot

  # RX slot carrying the analog reference (only used by
  # reference_source: analog_slot). Must differ from both microphone slots.
  # Options: 0 - 3. Waveshare 7B: slot 1.
  reference_slot: 1

  # Extra delay applied to the reference, in samples (16 samples = 1 ms at
  # 16 kHz). Options: 0 - 4000 for a playback reference, 0 - 256 for an
  # analog slot reference. The analog reference arrives synchronously in the
  # TDM frame; a small value here compensates the residual group delay of the
  # amp/loopback path (7 samples was measured on this board). SpeexDSP also
  # adapts over a range of delays itself, so this only needs to be roughly
  # right - get it inside a few ms and the filter converges.
  reference_delay_samples: 7

  # Which two TX slots the DAC consumes. Options: any two distinct slots
  # 0 - 3. Mono playback is duplicated to both; stereo maps L/R.
  tx_slots: [0, 1]

  # Bypass switch for slot mapping/debugging: publish raw RX slot N (0 - 3)
  # instead of the DSP output. Set from YAML or at runtime via
  # `id(audio_test).set_diagnostic_raw_slot(n)` (n = -1 restores DSP output).
  # Not set here on purpose - the UI buttons drive it.

  # --- SpeexDSP processing ---------------------------------------------------

  # Samples processed per iteration by the echo canceller and preprocessor.
  # Options: 128 / 192 / 256 / 320 / 384 / 512 / ... (multiple of 64, max
  # 1024). 256 = 16 ms: a good balance. Larger frames amortise FFT overhead
  # but increase latency; the whole frame must be processed within its real
  # time budget (frame_size / 16000 seconds).
  frame_size: 256

  # Length of the adaptive echo filter, in samples of tail time. Options:
  # 256 - 16384, at least frame_size. This is the dominant CPU/memory knob:
  #   512  (~32 ms)  very close, well-damped speaker setups; cheapest
  #   1024 (~64 ms)  small rooms, direct speaker-to-mic paths
  #   2048 (~128 ms) default; typical indoor echo tail
  #   4096 (~256 ms) large/reflective rooms or long playback-path latency
  # The tail must cover (speaker+room decay + reference offset) or residual
  # echo remains after the canceller converges. Unlike ESP-SR's filter_length
  # (small integer units), this is plain samples.
  filter_length: 1024

  # Which processed microphone channel is published. Options:
  #   first  - microphone_slots[0] (default; only one canceller is run)
  #   second - microphone_slots[1]
  #   mixed  - both processed independently and averaged (requires two
  #            microphone slots; runs two cancellers: ~2x CPU/memory)
  # SpeexDSP has no beamforming, so there is no dual-mic enhancement stage;
  # this is a selection between channels, not a combination of them.
  output_channel: first

  # Post-AEC adaptive delay-and-sum beamforming. Each microphone retains its
  # own stable echo path; localization runs on echo-cancelled signals and one
  # shared preprocessor runs after the aligned sum.
  beamforming:
    enabled: true
    # The microphones are 135 mm apart: ceil(135*16000/343000)=7 samples.
    # This covers the approximately 6.30-sample end-fire TDOA at 20 C.
    max_lag: 7
    # 8 * 256 samples / 16 kHz = 128 ms localization cadence.
    update_frames: 8
    min_rms: 120
    min_correlation_percent: 50
    min_peak_dominance_percent: 5

  # Speex preprocessor noise suppression (stationary noise: hiss, fan, hum).
  # Options: true / false.
  noise_suppression: true

  # Maximum noise attenuation in dB once the preprocessor decides a frame is
  # noise. Options: 5 - 60. Higher suppresses more noise but starts eating
  # quiet speech; 15 is Speex's default and a good start. The residual echo
  # suppressor below shares this gain machinery, so very large values can
  # also thin out speech during playback.
  noise_suppression_level_db: 10

  # Speex automatic gain control on the cleaned output: raises quiet speech
  # and tames loud speech toward agc_target_level. Options: true / false.
  agc: true

  # AGC target level as a fraction of digital full scale. Options: 0.01 - 1.0.
  # 0.25 ≈ -12 dBFS (Speex's own default of 8000/32768 ≈ 0.244). Values near
  # 1.0 will slam into clipping on loud syllables; recognition engines are
  # happiest well below full scale.
  agc_target_level: 0.25

  # Speex voice activity detection, evaluated on the published channel.
  # State is exposed via id(audio_test).get_vad_state() and
  # .get_vad_probability(). Options: true / false.
  vad: true

  # Speech-start probability threshold in percent. Options: 20 - 90. Higher
  # needs clearer speech to raise the flag (fewer false triggers in noise).
  # Speex's speech-continue threshold is fixed at 20 %, so values below 20
  # would never clear - hence the floor. Default 35 ≈ Speex's 0.35.
  vad_threshold: 35

  # Residual-echo suppression (works because the preprocessor is linked to
  # the echo canceller). During far-end-only audio (no near speech) residual
  # echo is clamped to echo_suppress_db below its level. Options: 5 - 60 dB.
  # Higher = calmer far-end tail, but risks "pumping" if the VAD misses
  # near-end speech. Default 40.
  echo_suppress_db: 40

  # Residual-echo suppression during double-talk (speech + playback). Options:
  # 5 - 60 dB. Keep this WELL below echo_suppress_db: it is the value that
  # decides whether the user's voice survives while a response is playing.
  # Default 15.
  echo_suppress_active_db: 10

  # Digital attenuation applied to media playback before the I2S TX and the
  # reference tap (they must stay identical). Keeps the amp/reference loopback
  # out of clipping: this board's loopback rails near digital full scale at
  # 0 dB ADC gain, so -12 dB leaves clean headroom. Options: -60 - 0.
  playback_gain_db: -12

  # Playback drift compensator: continuously retunes the playback rate against
  # the measured I2S clock so long streams never overrun/underrun the ring
  # buffer. Options: true / false. Leave false while measuring reference delay
  # (a fixed-speed probe is required for clean cross-correlation).
  resampler: true

  # Compile-time diagnostics (all default false):
  #   telemetry:   periodic AEC_EFFECT lines (raw/cleaned RMS, attenuation dB,
  #                reference correlation) during playback - the main tool for
  #                judging cancellation quality on this engine
  #   slot_logs:   five-second raw slot / output level summaries
  #   diagnostics: five-second error, buffer, timing and VAD statistics
  telemetry: true
  profiling: true


microphone:
  - platform: aec_speexdsp
    id: audio_test_microphone
    aec_speexdsp_id: audio_test

speaker:
  - platform: aec_speexdsp
    id: audio_test_speaker
    aec_speexdsp_id: audio_test

media_player:
  - platform: speaker
    id: audio_test_player
    internal: true
    announcement_pipeline:
      speaker: audio_test_speaker
      format: WAV
    files:
      - id: audio_test_file
        file: test-audio.wav
    on_play:
      - lambda: |-
          id(audio_test_playing) = true;
          lv_label_set_text(audio_test_playback_label, "STOP TEST AUDIO");
    on_idle:
      - lambda: |-
          id(audio_test_playing) = false;
          lv_label_set_text(audio_test_playback_label, "PLAY TEST AUDIO");

switch:
  - platform: gpio
    id: speaker_amp
    name: Audio Test Speaker Amplifier
    pin: GPIO53
    internal: true
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin:
      number: GPIO32
      inverted: true
    id: backlight
    channel: 0
    frequency: 1000Hz
    min_power: 0.1
    max_power: 0.8

light:
  - platform: monochromatic
    output: backlight
    id: display_backlight
    name: Audio Test Backlight
    internal: true
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0
    default_transition_length: 0s

globals:
  - id: audio_test_source
    type: int
    restore_value: no
    initial_value: '-1'
  - id: audio_test_playing
    type: bool
    restore_value: no
    initial_value: 'false'

touchscreen:
  platform: gt911
  id: audio_test_touchscreen
  display: audio_test_display
  i2c_id: bus_a
  reset_pin: GPIO23
  transform:
    mirror_x: true
    mirror_y: true

display:
  - platform: mipi_dsi
    id: audio_test_display
    update_interval: never
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    color_depth: 16bit
    pixel_mode: 16bit
    byte_order: little_endian

interval:
  - interval: 100ms
    then:
      - lambda: |-
          lv_obj_t *source_buttons[5] = {audio_test_source_dsp, audio_test_source_mic1,
                                         audio_test_source_mic2, audio_test_source_mic3,
                                         audio_test_source_mic4};
          const int selected_button = id(audio_test_source) < 0 ? 0 : id(audio_test_source);
          for (int button = 0; button < 5; button++)
            lv_obj_set_style_bg_color(source_buttons[button],
                                      lv_color_hex(button == selected_button ? 0x0f766e : 0x1e293b), LV_PART_MAIN);
          const float rms = id(audio_test_meters).get_output_dbfs();
          const uint32_t peak = id(audio_test_meters).get_output_peak();
          const uint32_t peak_3s = id(audio_test_meters).get_output_peak_3s();
          auto sample_to_db = [](uint32_t sample) {
            return sample > 0 ? 20.0f * log10f(sample / 32768.0f) : -96.0f;
          };
          const float peak_db = sample_to_db(peak);
          const float peak_3s_db = sample_to_db(peak_3s);
          auto width_for_db = [](float db) {
            return static_cast<int>(std::max(0.0f, std::min(1.0f, (db + 72.0f) / 72.0f)) * 820.0f);
          };
          lv_obj_set_width(audio_test_rms_fill, width_for_db(rms));
          lv_obj_set_width(audio_test_peak_fill, width_for_db(peak_db));
          lv_obj_set_x(audio_test_peak_3s_marker, 82 + width_for_db(peak_3s_db));
          char levels[96];
          snprintf(levels, sizeof(levels), "RMS %+.1f dBFS     PEAK %+.1f dBFS     3s PEAK %+.1f dBFS",
                   rms, peak_db, peak_3s_db);
          lv_label_set_text(audio_test_levels, levels);

          static lv_obj_t *bars[aec_speexdsp::AECSpeexDspMetersComponent::SPECTRUM_BINS]{};
          for (uint8_t bin = 0; bin < aec_speexdsp::AECSpeexDspMetersComponent::SPECTRUM_BINS; bin++) {
            if (bars[bin] == nullptr) {
              bars[bin] = lv_obj_create(audio_test_spectrum);
              lv_obj_remove_style_all(bars[bin]);
              lv_obj_set_pos(bars[bin], 18 + bin * 29, 222);
              lv_obj_set_size(bars[bin], 20, 1);
              lv_obj_set_style_radius(bars[bin], 4, LV_PART_MAIN);
              lv_obj_set_style_bg_opa(bars[bin], LV_OPA_COVER, LV_PART_MAIN);
            }
            const float db = std::max(-80.0f, std::min(0.0f, id(audio_test_meters).get_spectrum_db(bin)));
            const int height = std::max(1, static_cast<int>((db + 80.0f) * 185.0f / 80.0f));
            const uint32_t color = db > -12.0f ? 0xef4444 : (db > -28.0f ? 0xf59e0b : 0x22c55e);
            lv_obj_set_y(bars[bin], 223 - height);
            lv_obj_set_height(bars[bin], height);
            lv_obj_set_style_bg_color(bars[bin], lv_color_hex(color), LV_PART_MAIN);
          }

          const auto state = id(audio_test).get_capture_state();
          if (state == aec_speexdsp::AEC_SPEEXDSP_CAPTURE_CAPTURING) {
            const float seconds = id(audio_test).get_capture_frames() / 16000.0f;
            char status[48];
            snprintf(status, sizeof(status), "Recording... %.1f / 2.0 seconds", seconds);
            lv_label_set_text(audio_test_record_status, status);
          } else if (state == aec_speexdsp::AEC_SPEEXDSP_CAPTURE_READY) {
            lv_label_set_text(audio_test_record_status, "2-second recording ready");
          } else {
            lv_label_set_text(audio_test_record_status, "No recording");
          }

lvgl:
  id: audio_test_lvgl
  color_depth: 16
  byte_order: little_endian
  default_font: montserrat_18
  pages: !include ui.yaml

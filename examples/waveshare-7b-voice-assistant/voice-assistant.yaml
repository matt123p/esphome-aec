substitutions:
  name: waveshare-7b-voice-assistant
  friendly_name: Waveshare 7B Voice Assistant

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_on: speaker_amp
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - audio_dac.set_volume:
          id: speaker_dac
          volume: !lambda return id(assistant_volume).state / 100.0f;
      - script.execute: update_assistant_ui

external_components:
  - source:
      type: git
      url: https://github.com/matt123p/esphome-aec
      ref: main
      path: src/esphome
    components: [aec_audio]
  # Required until ES7210 four-channel TDM support is merged into ESPHome.
  - source: github://pr#18954
    components: [es7210]

esp32:
  board: esp32-p4
  variant: ESP32P4
  engineering_sample: true
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"

psram:
  mode: hex
  speed: 200MHz
  ignore_not_found: false

esp_ldo:
  - channel: 3
    voltage: 2.5V

# The ESP32-P4 uses the board's ESP32-C6 companion for Wi-Fi.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  id: home_assistant_api
  on_client_connected:
    - delay: 500ms
    - if:
        condition:
          lambda: return !id(wake_word_engine).is_running() && !id(voice_assistant_engine).is_running();
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - script.execute: stop_voice_assistant
    - micro_wake_word.stop:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: audio_i2c
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

audio_adc:
  - platform: es7210
    id: microphone_adc
    i2c_id: audio_i2c
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    # MIC1/MIC2 are microphones, MIC3 is the hardware reference, MIC4 unused.
    channel_gains: [33db, 33db, 0db, 0db]
    tdm: true

audio_dac:
  - platform: es8311
    id: speaker_dac
    i2c_id: audio_i2c
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

aec_audio:
  id: voice_audio
  audio_adc: microphone_adc
  mclk_pin: GPIO13
  bclk_pin: GPIO12
  lrclk_pin: GPIO10
  din_pin: GPIO11
  dout_pin: GPIO9
  i2s_port: 0
  tdm_slots: 4
  # ES7210 TDM order is CH1, CH3, CH2, CH4 on this board.
  microphone_slots: [0, 2]
  reference_source: analog_slot
  reference_slot: 1
  reference_delay_samples: 0
  tx_slots: [0, 1]
  afe_input_format: mmr
  aec_mode: fd_low_cost
  agc: true
  noise_suppression: true
  speech_enhancement: true
  nlp_level: normal
  filter_length: 4
  resampler: true
  wakenet: false

microphone:
  - platform: aec_audio
    id: voice_microphone
    aec_audio_id: voice_audio

speaker:
  - platform: aec_audio
    id: voice_speaker
    aec_audio_id: voice_audio

micro_wake_word:
  id: wake_word_engine
  microphone: voice_microphone
  models:
    - model: alexa
      probability_cutoff: 0.85
      sliding_window_size: 1
  on_wake_word_detected:
    # Preserve speech captured while the wake-word listener hands over to VA.
    - lambda: id(voice_microphone).request_pre_roll();
    - lambda: |-
        id(voice_assistant_engine).set_wake_word(wake_word);
        id(assistant_state) = 1;
        id(assistant_detail) = "How can I help?";
    - script.execute: update_assistant_ui
    - voice_assistant.start_continuous:

voice_assistant:
  id: voice_assistant_engine
  microphone: voice_microphone
  speaker: voice_speaker
  micro_wake_word: wake_word_engine
  use_wake_word: false
  # Audio is already processed by ESP-SR on the device.
  noise_suppression_level: 0
  volume_multiplier: 1.0

  on_start:
    - script.stop: assistant_idle_timeout
    - lambda: |-
        // The local wake word is metadata for the first request only.
        id(voice_assistant_engine).set_wake_word("");
        id(assistant_state) = 1;
        id(assistant_detail) = "How can I help?";
    - script.execute: update_assistant_ui
    - script.execute: assistant_idle_timeout

  on_listening:
    - lambda: id(voice_microphone).begin_pre_roll_replay();
    - script.stop: assistant_idle_timeout
    - lambda: |-
        id(assistant_state) = 1;
        id(assistant_detail) = "Listening for your request";
    - script.execute: update_assistant_ui
    - script.execute: assistant_idle_timeout

  on_stt_vad_end:
    - lambda: id(voice_microphone).discard_pending_audio();

  on_stt_end:
    - script.stop: assistant_idle_timeout
    - lambda: |-
        id(assistant_state) = 2;
        id(assistant_detail) = x;
    - script.execute: update_assistant_ui

  on_tts_stream_start:
    - lambda: id(voice_microphone).set_response_playing(true);

  on_tts_start:
    - lambda: |-
        id(voice_microphone).set_response_playing(true);
        id(assistant_state) = 3;
        id(assistant_detail) = x;
    - script.execute: update_assistant_ui

  on_tts_stream_end:
    - lambda: id(voice_microphone).set_response_playing(false);

  on_end:
    - lambda: |-
        id(voice_microphone).set_response_playing(false);
        id(voice_microphone).discard_pending_audio();
        id(assistant_state) = 0;
        id(assistant_detail) = "Say Alexa or tap Start";
    - script.execute: update_assistant_ui
    - if:
        condition:
          lambda: return id(home_assistant_api).is_connected() && !id(wake_word_engine).is_running();
        then:
          - micro_wake_word.start:

  on_error:
    - lambda: |-
        id(voice_microphone).set_response_playing(false);
        id(voice_microphone).discard_pending_audio();
        id(assistant_state) = 4;
        id(assistant_detail) = message;
    - script.execute: update_assistant_ui
    - script.execute: assistant_idle_timeout

globals:
  # 0 idle, 1 listening, 2 thinking, 3 replying, 4 error.
  - id: assistant_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: assistant_detail
    type: std::string
    restore_value: no
    initial_value: '"Say Alexa or tap Start"'

script:
  - id: start_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(home_assistant_api).is_connected();
          then:
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  lambda: return !id(wake_word_engine).is_running();
                timeout: 2s
            - lambda: |-
                id(assistant_state) = 1;
                id(assistant_detail) = "How can I help?";
            - script.execute: update_assistant_ui
            - voice_assistant.start_continuous:
          else:
            - lambda: |-
                id(assistant_state) = 4;
                id(assistant_detail) = "Home Assistant is disconnected";
            - script.execute: update_assistant_ui

  - id: stop_voice_assistant
    mode: restart
    then:
      - script.stop: assistant_idle_timeout
      - lambda: |-
          id(voice_microphone).set_response_playing(false);
          id(voice_microphone).discard_pending_audio();
      - voice_assistant.stop:
      - lambda: |-
          id(voice_assistant_engine).reset_conversation_id();
          id(assistant_state) = 0;
          id(assistant_detail) = "Say Alexa or tap Start";
      - script.execute: update_assistant_ui
      - if:
          condition:
            lambda: return id(home_assistant_api).is_connected() && !id(wake_word_engine).is_running();
          then:
            - micro_wake_word.start:

  - id: assistant_idle_timeout
    mode: restart
    then:
      - delay: 15s
      - if:
          condition:
            lambda: return id(assistant_state) == 1 || id(assistant_state) == 4;
          then:
            - script.execute: stop_voice_assistant

  - id: update_assistant_ui
    mode: restart
    then:
      - lambda: |-
          const char *status = "Ready";
          uint32_t color = 0x64748b;
          switch (id(assistant_state)) {
            case 1: status = "Listening"; color = 0x0f766e; break;
            case 2: status = "Thinking";  color = 0x1d4ed8; break;
            case 3: status = "Replying";  color = 0x7c3aed; break;
            case 4: status = "Error";     color = 0xb91c1c; break;
          }
          lv_label_set_text(assistant_status_label, status);
          lv_label_set_text(assistant_detail_label, id(assistant_detail).c_str());
          lv_obj_set_style_bg_color(assistant_status_card, lv_color_hex(color), LV_PART_MAIN);
          lv_label_set_text(assistant_action_label, id(assistant_state) == 0 ? "START" : "STOP");

number:
  - platform: template
    id: assistant_volume
    name: Assistant Volume
    optimistic: true
    unit_of_measurement: "%"
    initial_value: 60
    restore_value: true
    min_value: 0
    max_value: 100
    step: 5
    on_value:
      - audio_dac.set_volume:
          id: speaker_dac
          volume: !lambda return x / 100.0f;

switch:
  - platform: gpio
    id: speaker_amp
    pin: GPIO53
    internal: true
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: backlight_output
    pin:
      number: GPIO32
      inverted: true
    channel: 0
    frequency: 1000Hz
    min_power: 0.1
    max_power: 0.8

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_output
    internal: true
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0
    default_transition_length: 0s

touchscreen:
  platform: gt911
  id: touchscreen_7b
  display: display_7b
  i2c_id: audio_i2c
  reset_pin: GPIO23
  transform:
    mirror_x: true
    mirror_y: true

display:
  - platform: mipi_dsi
    id: display_7b
    update_interval: never
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    color_depth: 16bit
    pixel_mode: 16bit
    byte_order: little_endian

lvgl:
  id: assistant_lvgl
  color_depth: 16
  byte_order: little_endian
  default_font: montserrat_24
  pages: !include ui.yaml

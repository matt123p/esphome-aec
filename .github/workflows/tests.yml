name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aec-speexdsp-tests:
    name: aec_speexdsp (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install host test dependencies
        run: python3 -m pip install numpy pytest

      - name: Run module configuration and microphone/routing tests
        run: python3 -m pytest -q tests/test_neural_barge_config.py tests/test_aec_microphone.py tests/test_aec_vad_routing.py tests/test_reference_config.py tests/test_voice_state.py tests/test_voice_upload.py tests/test_wake_beep.py

      - name: Run aec_speexdsp test suite
        run: bash tests/aec_speexdsp/run_tests.sh

      - name: Run neural preprocessor probes
        run: |
          tests/aec_speexdsp/build/asan/neural_barge_probe < /dev/null
          tests/aec_speexdsp/build/release/neural_barge_probe < /dev/null

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aec-speexdsp-test-logs
          path: tests/aec_speexdsp/build/out/
          if-no-files-found: ignore

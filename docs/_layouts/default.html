<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/getting-started/' | relative_url }}">Getting Started</a>
          <a href="{{ '/examples/' | relative_url }}">Examples</a>
          <a href="{{ '/first-time-setup/' | relative_url }}">Board Setup</a>
          <a href="{{ '/hardware/' | relative_url }}">Hardware</a>
          <a href="{{ '/architecture/' | relative_url }}">How It Works</a>
          <a href="{{ '/configuration/' | relative_url }}">Configuration</a>
          <a href="{{ '/tuning/' | relative_url }}">Tuning</a>
          <a href="{{ '/troubleshooting/' | relative_url }}">Troubleshooting</a>
        </nav>
      </header>
      <div class="content-column">
        <main class="page-content">
          {{ content }}
        </main>
        <footer class="site-footer">
          <p>Source code: <a href="https://github.com/matt123p/esphome-aec">github.com/matt123p/esphome-aec</a></p>
        </footer>
      </div>
    </div>
  </body>
</html>

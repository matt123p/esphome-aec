<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AEC audio system architecture</title>
  <desc id="desc">Two microphones and a playback reference enter the TDM receiver and ESP-SR audio front end. Cleaned speech is sent to wake word detection and Home Assistant. Response audio returns through rate matching, TDM transmission, the DAC, and speaker.</desc>
  <defs>
    <marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="reference-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#16202b} .h{font-size:24px;font-weight:700}.l{font-size:18px;font-weight:650}.s{font-size:15px;fill:#52606d}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.audio{fill:#ecfdf5;stroke:#0f766e}.process{fill:#eff6ff;stroke:#2563eb}.host{fill:#faf5ff;stroke:#7c3aed}.line{fill:none;stroke:#64748b;stroke-width:3}.echo{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:9 7}.dot{fill:#64748b}
    </style>
  </defs>
  <text x="40" y="40" class="h">Capture and recognition</text>
  <rect x="40" y="75" width="190" height="110" rx="14" class="box audio"/>
  <text x="135" y="112" text-anchor="middle" class="l">Audio inputs</text><text x="135" y="140" text-anchor="middle" class="s">Mic 1 · Mic 2</text><text x="135" y="164" text-anchor="middle" class="s">hardware reference</text>
  <rect x="285" y="75" width="195" height="110" rx="14" class="box"/>
  <text x="382" y="112" text-anchor="middle" class="l">TDM receive</text><text x="382" y="140" text-anchor="middle" class="s">four synchronized</text><text x="382" y="164" text-anchor="middle" class="s">16 kHz slots</text>
  <rect x="535" y="75" width="215" height="110" rx="14" class="box process"/>
  <text x="642" y="105" text-anchor="middle" class="l">ESP-SR AFE</text><text x="642" y="134" text-anchor="middle" class="s">AEC · speech enhancement</text><text x="642" y="158" text-anchor="middle" class="s">noise suppression · AGC</text>
  <rect x="805" y="75" width="165" height="110" rx="14" class="box audio"/>
  <text x="887" y="112" text-anchor="middle" class="l">Clean speech</text><text x="887" y="140" text-anchor="middle" class="s">pre-buffer + live</text><text x="887" y="164" text-anchor="middle" class="s">microphone stream</text>
  <rect x="1025" y="75" width="135" height="110" rx="14" class="box host"/>
  <text x="1092" y="110" text-anchor="middle" class="l">Assist</text><text x="1092" y="139" text-anchor="middle" class="s">wake word</text><text x="1092" y="163" text-anchor="middle" class="s">Home Assistant</text>
  <path d="M230 130H285" class="line" marker-end="url(#signal-arrow)"/><path d="M480 130H535" class="line" marker-end="url(#signal-arrow)"/><path d="M750 130H805" class="line" marker-end="url(#signal-arrow)"/><path d="M970 130H1025" class="line" marker-end="url(#signal-arrow)"/>
  <text x="40" y="280" class="h">Response playback</text>
  <rect x="1025" y="315" width="135" height="105" rx="14" class="box host"/><text x="1092" y="355" text-anchor="middle" class="l">Response</text><text x="1092" y="384" text-anchor="middle" class="s">16 kHz PCM</text>
  <rect x="785" y="315" width="185" height="105" rx="14" class="box process"/><text x="877" y="350" text-anchor="middle" class="l">Rate matching</text><text x="877" y="379" text-anchor="middle" class="s">playback buffer</text><text x="877" y="402" text-anchor="middle" class="s">reference copy</text>
  <rect x="545" y="315" width="185" height="105" rx="14" class="box"/><text x="637" y="350" text-anchor="middle" class="l">TDM transmit</text><text x="637" y="379" text-anchor="middle" class="s">configured TX slots</text>
  <rect x="305" y="315" width="185" height="105" rx="14" class="box audio"/><text x="397" y="350" text-anchor="middle" class="l">DAC + amplifier</text><text x="397" y="379" text-anchor="middle" class="s">analog playback</text>
  <rect x="65" y="315" width="185" height="105" rx="14" class="box audio"/><text x="157" y="350" text-anchor="middle" class="l">Loudspeaker</text><text x="157" y="379" text-anchor="middle" class="s">sound in the room</text>
  <path d="M1025 367H970" class="line" marker-end="url(#signal-arrow)"/><path d="M785 367H730" class="line" marker-end="url(#signal-arrow)"/><path d="M545 367H490" class="line" marker-end="url(#signal-arrow)"/><path d="M305 367H250" class="line" marker-end="url(#signal-arrow)"/>
  <path d="M157 315C157 245 135 245 135 185" class="echo" marker-end="url(#reference-arrow)"/><text x="176" y="250" class="s">acoustic echo reaches both microphones</text>
  <path d="M832 315C730 260 690 245 650 185" class="echo" marker-end="url(#reference-arrow)"/><text x="690" y="254" class="s">software reference when selected</text>
</svg>

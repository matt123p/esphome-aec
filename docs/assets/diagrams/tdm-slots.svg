<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Waveshare 7B four-slot TDM mapping</title>
  <desc id="desc">Each receive frame contains microphone one in slot zero, hardware reference in slot one, microphone two in slot two, and an unused fourth slot. Transmit slots zero and one carry playback to the DAC.</desc>
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#16202b}.h{font-size:22px;font-weight:700}.l{font-size:18px;font-weight:650}.s{font-size:15px;fill:#52606d}.mic{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}.ref{fill:#fef3c7;stroke:#d97706;stroke-width:2}.unused{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.play{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.frame{fill:none;stroke:#64748b;stroke-width:2}</style></defs>
  <text x="45" y="42" class="h">One 16 kHz frame on the shared TDM bus</text>
  <text x="45" y="92" class="l">Receive · ADC to ESP32</text>
  <rect x="45" y="115" width="1110" height="105" rx="12" class="frame"/>
  <rect x="45" y="115" width="277.5" height="105" rx="12" class="mic"/><text x="184" y="153" text-anchor="middle" class="l">Slot 0</text><text x="184" y="183" text-anchor="middle" class="s">Microphone 1</text>
  <rect x="322.5" y="115" width="277.5" height="105" class="ref"/><text x="461" y="153" text-anchor="middle" class="l">Slot 1</text><text x="461" y="183" text-anchor="middle" class="s">Hardware playback reference</text>
  <rect x="600" y="115" width="277.5" height="105" class="mic"/><text x="739" y="153" text-anchor="middle" class="l">Slot 2</text><text x="739" y="183" text-anchor="middle" class="s">Microphone 2</text>
  <rect x="877.5" y="115" width="277.5" height="105" rx="12" class="unused"/><text x="1016" y="153" text-anchor="middle" class="l">Slot 3</text><text x="1016" y="183" text-anchor="middle" class="s">Unused</text>
  <text x="45" y="290" class="l">Transmit · ESP32 to DAC</text>
  <rect x="45" y="313" width="1110" height="82" rx="12" class="frame"/>
  <rect x="45" y="313" width="277.5" height="82" rx="12" class="play"/><text x="184" y="349" text-anchor="middle" class="l">Slot 0 · left / mono</text><text x="184" y="373" text-anchor="middle" class="s">selected by tx_slots</text>
  <rect x="322.5" y="313" width="277.5" height="82" class="play"/><text x="461" y="349" text-anchor="middle" class="l">Slot 1 · right / mono</text><text x="461" y="373" text-anchor="middle" class="s">selected by tx_slots</text>
  <rect x="600" y="313" width="277.5" height="82" class="unused"/><text x="739" y="361" text-anchor="middle" class="s">not used by DAC</text>
  <rect x="877.5" y="313" width="277.5" height="82" rx="12" class="unused"/><text x="1016" y="361" text-anchor="middle" class="s">not used by DAC</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Staged AEC board bring-up</title>
  <desc id="desc">Eight numbered checkpoints progress from basic board operation through codec initialization, diagnostic audio, gain setting, slot mapping, playback, reference verification, and final DSP evaluation.</desc>
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#16202b}.h{font-size:22px;font-weight:700}.l{font-size:16px;font-weight:650}.s{font-size:14px;fill:#52606d}.track{stroke:#cbd5e1;stroke-width:6}.node{fill:#fff;stroke:#0f766e;stroke-width:3}.num{font-size:20px;font-weight:700;fill:#0f766e}.gate{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}</style></defs>
  <text x="45" y="42" class="h">Prove each layer before judging echo cancellation</text>
  <line x1="100" y1="145" x2="1100" y2="145" class="track"/>
  <g><circle cx="100" cy="145" r="30" class="node"/><text x="100" y="152" text-anchor="middle" class="num">1</text><text x="100" y="205" text-anchor="middle" class="l">Board</text><text x="100" y="228" text-anchor="middle" class="s">boot · PSRAM</text></g>
  <g><circle cx="243" cy="145" r="30" class="node"/><text x="243" y="152" text-anchor="middle" class="num">2</text><text x="243" y="205" text-anchor="middle" class="l">Codecs</text><text x="243" y="228" text-anchor="middle" class="s">I²C · clocks</text></g>
  <g><circle cx="386" cy="145" r="30" class="node"/><text x="386" y="152" text-anchor="middle" class="num">3</text><text x="386" y="205" text-anchor="middle" class="l">Diagnostic hub</text><text x="386" y="228" text-anchor="middle" class="s">stable transport</text></g>
  <g><circle cx="529" cy="145" r="30" class="node"/><text x="529" y="152" text-anchor="middle" class="num">4</text><text x="529" y="205" text-anchor="middle" class="l">Gains</text><text x="529" y="228" text-anchor="middle" class="s">mic · reference</text></g>
  <g><circle cx="671" cy="145" r="30" class="node"/><text x="671" y="152" text-anchor="middle" class="num">5</text><text x="671" y="205" text-anchor="middle" class="l">RX slots</text><text x="671" y="228" text-anchor="middle" class="s">map both mics</text></g>
  <g><circle cx="814" cy="145" r="30" class="node"/><text x="814" y="152" text-anchor="middle" class="num">6</text><text x="814" y="205" text-anchor="middle" class="l">Playback</text><text x="814" y="228" text-anchor="middle" class="s">clean TX audio</text></g>
  <g><circle cx="957" cy="145" r="30" class="node"/><text x="957" y="152" text-anchor="middle" class="num">7</text><text x="957" y="205" text-anchor="middle" class="l">Reference</text><text x="957" y="228" text-anchor="middle" class="s">present · aligned</text></g>
  <g><circle cx="1100" cy="145" r="30" class="node"/><text x="1100" y="152" text-anchor="middle" class="num">8</text><text x="1100" y="205" text-anchor="middle" class="l">Evaluate AEC</text><text x="1100" y="228" text-anchor="middle" class="s">AEC · double-talk</text></g>
  <rect x="260" y="285" width="680" height="62" rx="12" class="gate"/><text x="600" y="312" text-anchor="middle" class="l">Stop at the first failed checkpoint</text><text x="600" y="334" text-anchor="middle" class="s">Later processing cannot repair missing, clipped, distorted, or incorrectly routed audio.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Rolling pre-buffer hand-off timeline</title>
  <desc id="desc">A one-second rolling history preserves audio around wake-word detection. One hundred milliseconds before the listener position and newly captured audio are queued, replayed to the voice assistant, and followed by live speech. Response audio and a three-hundred millisecond tail are excluded.</desc>
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#16202b}.h{font-size:22px;font-weight:700}.l{font-size:17px;font-weight:650}.s{font-size:15px;fill:#52606d}.axis{stroke:#94a3b8;stroke-width:2}.tick{stroke:#64748b;stroke-width:2}.history{fill:#dbeafe}.prefix{fill:#99f6e4}.live{fill:#ccfbf1}.response{fill:#fee2e2}.tail{fill:#ffedd5}.mark{stroke:#7c3aed;stroke-width:4}.brace{fill:none;stroke:#0f766e;stroke-width:3}</style></defs>
  <text x="45" y="40" class="h">Audio retained around a wake-word hand-off</text>
  <text x="45" y="105" class="l">Rolling history</text><rect x="230" y="78" width="420" height="44" rx="8" class="history"/><text x="440" y="106" text-anchor="middle" class="s">latest one second, continuously overwritten</text>
  <line x1="75" y1="180" x2="1145" y2="180" class="axis"/>
  <line x1="650" y1="145" x2="650" y2="330" class="mark"/><text x="650" y="137" text-anchor="middle" class="l">wake word detected</text>
  <line x1="600" y1="165" x2="600" y2="195" class="tick"/><text x="600" y="220" text-anchor="middle" class="s">100 ms headroom</text>
  <rect x="600" y="250" width="125" height="55" rx="8" class="prefix"/><text x="662" y="273" text-anchor="middle" class="l">Preserved</text><text x="662" y="294" text-anchor="middle" class="s">prefix</text>
  <rect x="725" y="250" width="255" height="55" rx="8" class="live"/><text x="852" y="283" text-anchor="middle" class="l">Live request audio</text>
  <path d="M600 325v16h380v-16" class="brace"/><text x="790" y="370" text-anchor="middle" class="s">one chronological stream delivered to speech-to-text</text>
  <rect x="980" y="250" width="110" height="55" rx="8" class="response"/><text x="1035" y="283" text-anchor="middle" class="l">Response</text>
  <rect x="1090" y="250" width="55" height="55" rx="8" class="tail"/><text x="1117" y="330" text-anchor="middle" class="s">300 ms tail</text>
  <text x="1038" y="400" text-anchor="middle" class="s">excluded from delivery and history</text>
  <text x="75" y="205" class="s">earlier</text><text x="1100" y="205" class="s">later</text>
</svg>
